<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakta oss</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 class="headline">Kontakta oss</h1>
        <nav>
            <ul>
                <li><a href="index.html">Startsida</a></li>
                <li><a href="kontakta.html">Kontakta oss</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <p>För kontakt eller bokning, fyll i formulär nedan.</p>

        <form>
            <label for="namn">Namn:</label><br>
            <input type="text" id="namn" name="namn"><br><br>

            <label for="epost">E-post:</label><br>
            <input type="email" id="epost" name="epost"><br><br>

            <label for="meddelande">Meddelande:</label><br>
            <textarea id="meddelande" name="meddelande"></textarea><br><br>

            <button type="submit">Skicka</button>
        </form>

    </main>

    <footer>
        <p>Hotellvägen 25, Sverige</p>
    </footer>
</body>
</html>
